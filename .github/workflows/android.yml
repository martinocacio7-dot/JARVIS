name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/prepare-wake-model.py', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y analizar Android
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-prueba
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
