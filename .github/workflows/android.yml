name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/prepare-wake-model.py', 'scripts/prepare-mobile-brain.js', 'neural/**', 'knowledge/**', 'assistant/everyday.js', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        notifications: ['true', 'false']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y analizar Android
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease testDebugUnitTest -PjarvisNotificationReader=${{ matrix.notifications }}
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-notifications-${{ matrix.notifications }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
