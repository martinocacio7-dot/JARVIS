plugins { id 'com.android.application' }
android {
    namespace 'com.miguel.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'com.miguel.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 18
        versionName '2.0.1'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildFeatures { buildConfig true }
    packaging { jniLibs { useLegacyPackaging = true } }
    buildTypes { release { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.alphacephei:vosk-android:0.3.75'; testImplementation 'junit:junit:4.13.2' }

def wakeAssets = layout.buildDirectory.dir('generated/wake-assets')
android.sourceSets.main.assets.srcDir(wakeAssets)
def prepareWakeModel = tasks.register('prepareWakeModel', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine (System.getenv('JARVIS_PYTHON') ?: 'python3'), 'scripts/prepare-wake-model.py', '--output', wakeAssets.get().asFile.absolutePath
    inputs.file(rootProject.file('../scripts/prepare-wake-model.py'))
    inputs.file(rootProject.file('wake-model.json'))
    outputs.dir(wakeAssets)
}
tasks.named('preBuild').configure { dependsOn prepareWakeModel }

def brainAssets = layout.buildDirectory.dir('generated/brain-assets')
android.sourceSets.main.assets.srcDir(brainAssets)
android.sourceSets.test.resources.srcDir(brainAssets)
def prepareMobileBrain = tasks.register('prepareMobileBrain', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/prepare-mobile-brain.js', brainAssets.get().asFile.absolutePath
    inputs.files(rootProject.file('../scripts/prepare-mobile-brain.js'), rootProject.file('../assistant/everyday.js'), rootProject.file('../neural/network.js'), rootProject.file('../neural/conversation.js'), rootProject.file('../neural/model.json'), rootProject.file('../neural/evaluation.json'), rootProject.file('../neural/challenge.json'), rootProject.file('../neural/generalization.json'))
    inputs.dir(rootProject.file('../knowledge'))
    outputs.dir(brainAssets)
}
tasks.named('preBuild').configure { dependsOn prepareMobileBrain }
dependencies { testImplementation 'org.json:json:20240303' }
