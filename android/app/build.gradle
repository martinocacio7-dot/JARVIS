plugins { id 'com.android.application' }
android {
    namespace 'com.miguel.jarvis'
    compileSdk 35
    defaultConfig {
        applicationId 'com.miguel.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.2.1'
    }
    buildFeatures { buildConfig true }
    buildTypes { release { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'ai.picovoice:porcupine-android:4.0.2'; testImplementation 'junit:junit:4.13.2' }
